name: PR Lint

# release-please derives version bumps and changelog entries from Conventional
# Commit types on main, and squash-merged PRs use the PR title as that commit
# message. Enforce the title format here so every merged PR is something
# release-please actually understands, instead of failing silently on main.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
          requireScope: false
