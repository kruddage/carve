<!doctype html>
<!--
  This file is two things at once, deliberately.

  It is still the coming-soon landing page served at
  https://kruddage.github.io/carve/ — nothing about it was deleted — and it is
  now also Vite's entry HTML, because Vite wants exactly this path.

  The alternative was moving the landing page aside (say to `landing/`) and
  giving the app its own shell. That was rejected: the app has no UI until
  issue #9, so a separate shell would ship a blank page over the top of a
  working landing page for the whole of M0 and M1. Instead the markup below
  stays as the initial shell, and issue #9 replaces the <main> content with the
  modeler when there is something to put there.

  Rationale and consequences are written up in docs/dev-setup.md.
-->
