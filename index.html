<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carve — Coming Soon</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0b0f;
      --fg: #f5f5f7;
      --accent: #7c5cff;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1a1a24, var(--bg) 60%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    main { max-width: 32rem; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 1.125rem;
      color: #a1a1aa;
      margin: 0;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      margin-bottom: 1.5rem;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Coming Soon</span>
    <h1>Carve</h1>
    <p>We're building something. Check back soon.</p>
  </main>
</body>
</html>
